version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vapor_postgres
    environment:
      POSTGRES_USER: vapor_user
      POSTGRES_PASSWORD: vapor_password
      POSTGRES_DB: vapor_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vapor_user -d vapor_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vapor_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: vapor_api
    environment:
      DATABASE_URL: postgresql+asyncpg://vapor_user:vapor_password@postgres:5432/vapor_os
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
